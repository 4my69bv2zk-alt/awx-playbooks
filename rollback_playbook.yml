---
- name: Restore Original Domain Separation
  hosts: all
  become: yes
  tasks:
    # --- 1. SET CONTENT ---
    - name: Set AWX 1 Content on .80
      copy:
        content: "<h1>Welcome to AWX 1</h1>"
        dest: /var/www/html/index.html
      when: inventory_hostname == '10.18.168.80'

    - name: Set AWX 2 Content on .79
      copy:
        content: "<h1>Welcome to AWX 2</h1>"
        dest: /var/www/html/index.html
      when: inventory_hostname == '10.18.168.79'

    # --- 2. CONFIGURE HAPROXY ACLs ---
    - name: Configure HAProxy for Domain Routing
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              
              # Define ACLs based on Host Header
              acl is_prod hdr(host) -i ansiblelb.com
              acl is_staging hdr(host) -i ansiblestaging.com

              # Map ACLs to Backends
              use_backend awx1_pool if is_prod
              use_backend awx2_pool if is_staging

          backend awx1_pool
              server server_80 10.18.168.80:80 check

          backend awx2_pool
              server server_79 10.18.168.79:80 check
      when: inventory_hostname == '10.18.168.81'
      notify: restart_haproxy

  handlers:
    - name: restart_haproxy
      service:
        name: haproxy
        state: restarted
