---
- name: Setup HAProxy Blue-Green Load Balancer
  hosts: loadbalancer
  become: yes
  vars:
    # 'target_vm_ip' is the placeholder. 
    # Its value will come from the AWX Job Template "Extra Vars".
    lb_domain: "ansiblelb.com"
    staging_domain: "ansiblestaging.com"

  tasks:
    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Configure /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "10.18.168.81 {{ item }}"
        state: present
      loop:
        - "{{ lb_domain }}"
        - "{{ staging_domain }}"

    - name: Deploy HAProxy Configuration with Auto-Staging
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              # Identify domains
              acl is_staging hdr(host) -i ansiblestaging.com
              
              # Routing logic
              use_backend staging_pool if is_staging
              default_backend production_pool

          backend production_pool
              # This is the IP you choose in AWX (e.g., .80)
              server prod_node {{ target_vm_ip }}:80 check

          backend staging_pool
              # If target is .80, staging becomes .79. If target is .79, staging becomes .80.
              server stage_node {{ '10.18.168.79' if target_vm_ip == '10.18.168.80' else '10.18.168.80' }}:80 check
      notify: restart haproxy

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
