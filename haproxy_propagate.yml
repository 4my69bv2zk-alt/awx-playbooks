- name: Propagate HAProxy Routing with Failover
  hosts: loadbalancer
  become: yes
  tasks:
    - name: Configure HAProxy for Blue-Green with Failover
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              
              # Identify which URL the user is typing
              acl is_lb_url hdr(host) -i ansiblelb.com
              acl is_staging_url hdr(host) -i ansiblestaging.com

              {% if deployment_state == 'green' %}
              # --- GREEN MODE LOGIC ---
              # Block staging entirely
              http-request deny if is_staging_url
              # Route production to AWX 3 (.80)
              use_backend awx3_pool if is_lb_url
              {% else %}
              # --- BLUE MODE LOGIC ---
              # Both URLs are accessible
              use_backend awx3_pool if is_lb_url
              use_backend awx4_pool if is_staging_url
              {% endif %}

          backend awx3_pool
              server node_80 10.18.168.80:80 check

          backend awx4_pool
              server node_79 10.18.168.79:80 check
      notify: restart haproxy

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
