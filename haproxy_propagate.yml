- name: Propagate HAProxy Routing with Failover
  hosts: loadbalancer
  become: yes
  tasks:
    - name: Configure HAProxy for Blue-Green with Failover
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              default_backend production_cluster

          backend production_cluster
              option httpchk GET /
              # Primary: This is either .80 or .79 depending on the AWX Job
              server primary_node {{ target_vm_ip }}:80 check
              
              # Failover: Point to AWX2 (10.18.168.80) as a backup
              # If you are currently live on .79 and it fails, it goes to .80
              server backup_node 10.18.168.80:80 check backup
      notify: restart haproxy

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
