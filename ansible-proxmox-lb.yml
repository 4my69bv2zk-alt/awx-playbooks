---
- name: Setup HAProxy Load Balancer
  hosts: loadbalancer
  become: yes
  vars:
    lb_ip: "10.18.168.81"
    node_80_ip: "10.18.168.80"
    node_79_ip: "10.18.168.79"

  tasks:
    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Configure /etc/hosts for local resolution
      lineinfile:
        path: /etc/hosts
        line: "{{ lb_ip }} {{ item }}"
        state: present
      loop:
        - ansiblelb.com
        - ansiblestaging.com

    - name: Deploy HAProxy Configuration
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              # Define ACLs for each domain
              acl is_lb_com hdr(host) -i ansiblelb.com
              acl is_staging_com hdr(host) -i ansiblestaging.com
              
              # Direct routing: Each domain goes to its own backend
              use_backend backend_80 if is_lb_com
              use_backend backend_79 if is_staging_com

          backend backend_80
              server nginx_node_80 {{ node_80_ip }}:80 check

          backend backend_79
              server nginx_node_79 {{ node_79_ip }}:80 check
      notify: restart haproxy

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
