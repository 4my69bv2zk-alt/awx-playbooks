---
- name: Setup HAProxy Load Balancer
  hosts: loadbalancer
  become: yes
  vars:
    lb_ip: "10.18.168.81"
    # Replace these with your actual Nginx backend IPs
    backend_nodes:
      - { name: 'nginx_node_1', ip: '10.18.168.79' }
      - { name: 'nginx_node_2', ip: '10.18.168.80' }

  tasks:
    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Configure /etc/hosts for local resolution
      lineinfile:
        path: /etc/hosts
        line: "{{ lb_ip }} {{ item }}"
        state: present
      loop:
        - ansiblelb.com
        - ansiblestaging.com

    - name: Deploy Path-Based HAProxy Configuration
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              
              # Define paths
              acl path_site1 path_beg /site1
              acl path_site2 path_beg /site2
              
              # Route based on the path (regardless of domain used)
              use_backend backend_79 if path_site1
              use_backend backend_80 if path_site2

          backend backend_79
              # This strips the "/site1" prefix so Nginx sees a normal request
              http-request set-path %[path,regsub(^/site1/?,/)]
              server nginx1 10.18.168.79:81 check

          backend backend_80
              # This strips the "/site2" prefix so Nginx sees a normal request
              http-request set-path %[path,regsub(^/site2/?,/)]
              server nginx2 10.18.168.80:80 check
      notify: restart haproxy

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
