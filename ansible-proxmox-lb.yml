---
- name: Setup HAProxy Load Balancer
  hosts: loadbalancer
  become: yes
  vars:
    lb_ip: "10.18.168.81"
    # Replace these with your actual Nginx backend IPs
    backend_nodes:
      - { name: 'nginx_node_1', ip: '10.18.168.79' }
      - { name: 'nginx_node_2', ip: '10.18.168.80' }

  tasks:
    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Configure /etc/hosts for local resolution
      lineinfile:
        path: /etc/hosts
        line: "{{ lb_ip }} {{ item }}"
        state: present
      loop:
        - ansiblelb.com
        - ansiblestaging.com

    - name: Deploy Path-Swapped HAProxy Configuration
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              
              # Define path-based ACLs
              acl is_site1 path_beg /site1
              acl is_site2 path_beg /site2
              
              # Routing logic (Swapped per your requirement)
              use_backend backend_site1 if is_site1
              use_backend backend_site2 if is_site2

          backend backend_site1
              # This path (/site1) routes to .80
              http-request set-path %[path,regsub(^/site1/?,/)]
              server nginx_80 10.18.168.80:80 check

          backend backend_site2
              # This path (/site2) routes to .79
              http-request set-path %[path,regsub(^/site2/?,/)]
              server nginx_79 10.18.168.79:80 check
      notify: restart haproxy

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
