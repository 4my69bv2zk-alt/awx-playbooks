---
- name: Setup HAProxy Load Balancer
  hosts: loadbalancer
  become: yes
  vars:
    lb_ip: "10.18.168.81"
    # Replace these with your actual Nginx backend IPs
    backend_nodes:
      - { name: 'nginx_node_1', ip: '10.18.168.79' }
      - { name: 'nginx_node_2', ip: '10.18.168.80' }

  tasks:
    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Configure /etc/hosts for local resolution
      lineinfile:
        path: /etc/hosts
        line: "{{ lb_ip }} {{ item }}"
        state: present
      loop:
        - ansiblelb.com
        - ansiblestaging.com

    - name: Deploy HAProxy Configuration
      blockinfile:
        path: /etc/haproxy/haproxy.cfg
        block: |
          frontend http_in
              bind *:80
              # Define ACLs based on the domain name accessed
              acl is_prod hdr(host) -i ansiblelb.com
              acl is_staging hdr(host) -i ansiblestaging.com
              
              # Route to specific backends based on the domain
              use_backend prod_backend if is_prod
              use_backend staging_backend if is_staging

          backend prod_backend
              server nginx_prod {{ prod_node_ip }}:80 check

          backend staging_backend
              server nginx_staging {{ staging_node_ip }}:80 check
      notify: restart haproxy

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
