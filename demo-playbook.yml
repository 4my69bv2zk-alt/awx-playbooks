---
- name: Fix Nginx Ports on .80
  hosts: 10.18.168.80
  become: yes
  tasks:
    - name: Restore AWX 3 on Port 80
      copy: # <--- Align this 'c' under the 'n' in 'name'
        content: |
          server {
              listen 80;
              root /var/www/html;
              index index.html;
          }
        dest: /etc/nginx/sites-enabled/awx3

    - name: Keep AWX 2 on Port 8081
      copy:
        content: |
          server {
              listen 8081;
              root /var/www/awx2;
              index index.html;
          }
        dest: /etc/nginx/sites-enabled/awx2
      notify: restart nginx

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
